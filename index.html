<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QB Total Production Leaderboard</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2328;
      --muted: #656d76;
      --card: #f6f8fa;
      --border: #d0d7de;
      --accent: #1a7f37;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --text: #e6edf3;
        --muted: #8d96a0;
        --card: #161b22;
        --border: #30363d;
        --accent: #3fb950;
      }
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    h1 { font-size: 1.75rem; margin: 0 0 8px; }
    p.lede { color: var(--muted); margin: 0 0 32px; }
    a.season {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      margin-bottom: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
    }
    a.season:hover { border-color: var(--accent); }
    .year { font-size: 1.25rem; font-weight: 600; }
    .status { color: var(--muted); font-size: 0.9rem; }
    .live { color: var(--accent); }
    footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>QB Total Production Leaderboard</h1>
    <p class="lede">Passing and rushing combined into one view of every NFL quarterback's production and efficiency.</p>

    <!-- One link per season. Add a new <a> block at the top each year. -->
    <a class="season" href="index_2026.html">
      <span class="year">2026</span>
      <span class="status live">Live · updates every Tuesday</span>
    </a>

    <!-- 2025 Season: -->
    <a class="season" href="index_2025.html">
      <span class="year">2025</span>
      <span class="status">Final</span>
    </a>

    <!-- 2024 Season: -->
    <a class="season" href="index_2024.html">
      <span class="year">2024</span>
      <span class="status">Final</span>
    </a>
    
    <footer>Data: nflverse. Excludes spikes and kneels.</footer>
  </main>
</body>
</html>
